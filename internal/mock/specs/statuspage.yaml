        "201":
          description: Created
    get:
      operationId: listStatuspageComponents
      summary: List Statuspage components
      parameters:
        - name: page_id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Component list
  /v1/pages/{page_id}/components/{component_id}:
    get:
      operationId: getStatuspageComponent
      summary: Read a Statuspage component
      parameters:
        - name: page_id
          in: path
          required: true
          schema:
            type: string
        - name: component_id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Component details
    put:
      operationId: updateStatuspageComponent
      summary: Update a Statuspage component
      parameters:
        - name: page_id
          in: path
          required: true
          schema:
            type: string
        - name: component_id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
      responses:
        "200":
          description: Updated
    delete:
      operationId: deleteStatuspageComponent
      summary: Delete a Statuspage component
      parameters:
        - name: page_id
          in: path
          required: true
          schema:
            type: string
        - name: component_id
          in: path
          required: true
          schema:
            type: string
      responses:
        "204":
          description: Deleted
