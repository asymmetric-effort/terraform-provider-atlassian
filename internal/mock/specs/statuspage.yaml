---
openapi: "3.0.3"
info:
  title: Atlassian Mock API — Statuspage
  version: "0.1.0"
  description: >
    OpenAPI spec for mock Atlassian Statuspage endpoints covering
    pages, components, component groups, subscribers, incident
    templates, maintenance templates, and permissions.
paths:
  /v1/pages:
    post:
      operationId: createStatuspagePage
      summary: Create a Statuspage page
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StatuspagePageRequest"
      responses:
        "201":
          description: Created
    get:
      operationId: listStatuspagePages
      summary: List Statuspage pages
      responses:
        "200":
          description: Page list
  /v1/pages/{page_id}:
    get:
      operationId: getStatuspagePage
      summary: Read a Statuspage page
      parameters:
        - name: page_id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Page details
    put:
      operationId: updateStatuspagePage
      summary: Update a Statuspage page
      parameters:
        - name: page_id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
      responses:
        "200":
          description: Updated
    delete:
      operationId: deleteStatuspagePage
      summary: Delete a Statuspage page
      parameters:
        - name: page_id
          in: path
          required: true
          schema:
            type: string
      responses:
        "204":
          description: Deleted
  /v1/pages/{page_id}/components:
    post:
      operationId: createStatuspageComponent
      summary: Create a Statuspage component
      parameters:
        - name: page_id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
