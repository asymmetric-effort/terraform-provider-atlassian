components:
  schemas:
    StatuspagePageRequest:
      type: object
      required:
        - page
      properties:
        page:
          type: object
          required:
            - name
          properties:
            name:
              type: string
            page_description:
              type: string
            subdomain:
              type: string
    StatuspageComponentRequest:
      type: object
      required:
        - component
      properties:
        component:
          type: object
          required:
            - name
          properties:
            name:
              type: string
            description:
              type: string
            status:
              type: string
            group_id:
              type: string
    StatuspageComponentGroupRequest:
      type: object
      required:
        - component_group
      properties:
        component_group:
          type: object
          required:
            - name
          properties:
            name:
              type: string
            description:
              type: string
    StatuspageSubscriberRequest:
      type: object
      required:
        - subscriber
      properties:
        subscriber:
          type: object
          properties:
            email:
              type: string
            endpoint:
              type: string
            component_ids:
              type: array
              items:
                type: string
    StatuspageIncidentTemplateRequest:
      type: object
      required:
        - template
      properties:
        template:
          type: object
          required:
            - name
          properties:
            name:
              type: string
            title:
              type: string
            body:
              type: string
    StatuspageMaintenanceTemplateRequest:
      type: object
      required:
        - template
      properties:
        template:
          type: object
          required:
            - name
          properties:
            name:
              type: string
            title:
              type: string
            body:
              type: string
    StatuspagePermissionRequest:
      type: object
      required:
        - permission
      properties:
        permission:
          type: object
          required:
            - principal_type
            - principal_id
            - role
          properties:
            principal_type:
              type: string
            principal_id:
              type: string
            role:
              type: string
