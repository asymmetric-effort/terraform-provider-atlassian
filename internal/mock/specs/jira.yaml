---
openapi: "3.0.3"
info:
  title: Atlassian Mock API — Jira
  version: "0.1.0"
  description: >
    OpenAPI spec for mock Atlassian Jira endpoints covering
    spaces (projects), issue types, workflows, screens,
    schemes, dashboards, filters, fields, boards, priorities,
    automation rules, mail handlers, custom domains, and emails.
paths:
  /rest/api/3/project:
    post:
      operationId: createProject
      summary: Create a Jira space (project)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateProjectRequest"
      responses:
        "201":
          description: Created
    get:
      operationId: listProjects
      summary: List all projects
      responses:
        "200":
          description: Project list
  /rest/api/3/project/{idOrKey}:
    get:
      operationId: getProject
      summary: Read project
      parameters:
        - name: idOrKey
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Project details
    put:
      operationId: updateProject
      summary: Update project
      parameters:
        - name: idOrKey
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
      responses:
        "200":
          description: Updated
    delete:
      operationId: deleteProject
      summary: Delete project
      parameters:
        - name: idOrKey
          in: path
          required: true
          schema:
            type: string
      responses:
        "204":
          description: Deleted
