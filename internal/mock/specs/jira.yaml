components:
  schemas:
    CreateProjectRequest:
      type: object
      required:
        - key
        - name
        - projectTypeKey
      properties:
        key:
          type: string
        name:
          type: string
        projectTypeKey:
          type: string
        description:
          type: string
        leadAccountId:
          type: string
    NameRequired:
      type: object
      required:
        - name
      properties:
        name:
          type: string
        description:
          type: string
    CreateFieldRequest:
      type: object
      required:
        - name
        - type
      properties:
        name:
          type: string
        type:
          type: string
        description:
          type: string
    CreateBoardRequest:
      type: object
      required:
        - name
        - type
      properties:
        name:
          type: string
        type:
          type: string
          enum:
            - scrum
            - kanban
    CreateAutomationRuleRequest:
      type: object
      required:
        - name
        - trigger
      properties:
        name:
          type: string
        trigger:
          type: object
        conditions:
          type: object
        actions:
          type: object
        state:
          type: string
    CreateDomainRequest:
      type: object
      required:
        - domain
      properties:
        domain:
          type: string
    CreateEmailRequest:
      type: object
      required:
        - emailAddress
      properties:
        emailAddress:
          type: string
        domainId:
          type: string
        spaceId:
          type: string
        active:
          type: boolean
