  /2.0/repositories/{workspace}/{slug}/permissions-config/groups:
    get:
      operationId: listGroupPermissions
      summary: List group permissions
      parameters:
        - name: workspace
          in: path
          required: true
          schema:
            type: string
        - name: slug
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Group permission list
components:
  schemas:
    BitbucketBranchRestrictionRequest:
      type: object
      required:
        - kind
      properties:
        kind:
          type: string
        pattern:
          type: string
        branch_match_kind:
          type: string
        branch_type:
          type: string
        users:
          type: array
          items:
            type: object
        groups:
          type: array
          items:
            type: object
        value:
          type: integer
    BitbucketEnvironmentRequest:
      type: object
      required:
        - name
      properties:
        name:
          type: string
        environment_type:
          type: object
          properties:
            name:
              type: string
            type:
              type: string
        rank:
          type: integer
