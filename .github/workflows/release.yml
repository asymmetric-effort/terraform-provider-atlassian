name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        goos: [linux, darwin]
        goarch: [amd64, arm64]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version: '1.26'

      - name: Install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@latest

      - name: Lint
        run: make lint

      - name: Test
        run: make test

      - name: Build
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: |
          BINARY=terraform-provider-atlassian_${GOOS}_${GOARCH}
          go build -trimpath -ldflags '-s -w -X main.version=${{ github.ref_name }}' -o build/${BINARY} .

      - name: Upload artifact
        uses: actions/upload-artifact@ea165f8d65b6db9a2b7fce564e12e2e0981b3c2e # v4.6.2
        with:
          name: terraform-provider-atlassian_${{ matrix.goos }}_${{ matrix.goarch }}
          path: build/terraform-provider-atlassian_${{ matrix.goos }}_${{ matrix.goarch }}

  publish:
    needs: release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          path: artifacts/

      - name: Create checksums
        run: |
          cd artifacts
          find . -type f -name 'terraform-provider-atlassian_*' -exec sha256sum {} \; > SHA256SUMS

      - name: Create GitHub Release
        uses: softprops/action-gh-release@da05d552573ad5aba039eaac05058a918a7bf631 # v2.2.2
        with:
          generate_release_notes: true
          files: |
            artifacts/**/terraform-provider-atlassian_*
            artifacts/SHA256SUMS
