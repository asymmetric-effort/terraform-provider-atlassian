name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        goos: [linux, darwin]
        goarch: [amd64, arm64]
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version: '1.26'

      - name: Install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@latest

      - name: Lint
        run: make lint

      - name: Test
        run: make test

      - name: Build
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: |
          BINARY=terraform-provider-atlassian_${GOOS}_${GOARCH}
          go build -trimpath -ldflags '-s -w -X main.version=${{ github.ref_name }}' -o build/${BINARY} .

      - name: Upload artifact
        uses: actions/upload-artifact@ea165f8d65b6db9a2b7fce564e12e2e0981b3c2e # v4.6.2
        with:
          name: terraform-provider-atlassian_${{ matrix.goos }}_${{ matrix.goarch }}
          path: build/terraform-provider-atlassian_${{ matrix.goos }}_${{ matrix.goarch }}

  publish:
    needs: release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: artifacts/

      - name: Create checksums
        run: |
          cd artifacts
          find . -type f -name 'terraform-provider-atlassian_*' -exec sha256sum {} \; > SHA256SUMS

      - name: Create GitHub Release
        uses: softprops/action-gh-release@b4309332981a82ec1c5618f44dd2e27cc8bfbfda # v3.0.0
        with:
          generate_release_notes: true
          files: |
            artifacts/**/terraform-provider-atlassian_*
            artifacts/SHA256SUMS
