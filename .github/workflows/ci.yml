name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  lint-test-build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        go-version: ['1.26']
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version: ${{ matrix.go-version }}

      - name: Install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@latest

      - name: Lint
        run: make lint

      - name: Test
        run: make test

      - name: Coverage
        run: make cover

      - name: Build
        run: make build

      - name: Upload coverage
        uses: actions/upload-artifact@ea165f8d65b6db9a2b7fce564e12e2e0981b3c2e # v4.6.2
        with:
          name: coverage-report
          path: |
            coverage.out
            coverage.html
