---
name: CI

on:
  push:
    branches: [main]
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  # Stage 1a: Lint (parallel with test)
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version: '1.26'

      - name: Install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@latest

      - name: Install yamllint
        run: pip install --user yamllint

      - name: Install markdownlint
        run: npm install -g markdownlint-cli@0.37.0

      - name: Install jsonlint
        run: npm install -g jsonlint

      - name: Lint
        run: |
          export PATH="$HOME/.local/bin:$PATH"
          make lint

  # Stage 1b: Unit and integration tests (parallel with lint)
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version: '1.26'

      - name: Unit and integration tests
        run: make test

  # Stage 2a: Coverage check (requires stage 1a + 1b)
  cover:
    needs: [lint, test]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version: '1.26'

      - name: Coverage check (>=98% threshold)
        run: make cover

      - name: Upload coverage
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-report
          path: |
            coverage.out
            coverage.html

  # Stage 2b: Build (requires stage 1a + 1b)
  build:
    needs: [lint, test]
    runs-on: ubuntu-latest
    strategy:
      matrix:
        goos: [linux, darwin]
        goarch: [amd64, arm64]
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version: '1.26'

      - name: Build
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: |
          BINARY=terraform-provider-atlassian_${GOOS}_${GOARCH}
          go build -trimpath -ldflags '-s -w -X main.version=${{ github.ref_name }}' -o build/${BINARY} .

      - name: Upload artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: terraform-provider-atlassian_${{ matrix.goos }}_${{ matrix.goarch }}
          path: build/terraform-provider-atlassian_${{ matrix.goos }}_${{ matrix.goarch }}

  # Stage 3: Post-deployment verification (requires stage 2a + 2b)
  pdv:
    needs: [cover, build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version: '1.26'

      - name: E2E — mock-based tests with OpenTofu
        env:
          TF_ACC: "1"
        run: go test ./test/e2e/... -v -count=1 -timeout 300s -failfast

      - name: PDV — live Atlassian Cloud verification
        env:
          PDV: "1"
          TF_ACC: "1"
          ATLASSIAN_URL: ${{ secrets.ATLASSIAN_URL }}
          ATLASSIAN_USERNAME: ${{ secrets.ATLASSIAN_USERNAME }}
          ATLASSIAN_API_TOKEN: ${{ secrets.ATLASSIAN_API_KEY }}
        run: go test ./test/pdv/... -v -count=1 -timeout 300s -failfast

  # Stage 4: Publish (only on tagged push, after PDV passes)
  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: pdv
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: artifacts/

      - name: Create checksums
        run: |
          cd artifacts
          find . -type f -name 'terraform-provider-atlassian_*' \
            -exec sha256sum {} \; > SHA256SUMS

      - name: Create GitHub Release
        uses: softprops/action-gh-release@b4309332981a82ec1c5618f44dd2e27cc8bfbfda # v3.0.0
        with:
          generate_release_notes: true
          files: |
            artifacts/**/terraform-provider-atlassian_*
            artifacts/SHA256SUMS
